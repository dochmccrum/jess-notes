[package]
name = "jess-core-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["zip"]
zip = ["jess-core/zip"]

[dependencies]
jess-core = { path = "..", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
minicbor.workspace = true
hex.workspace = true
sha2.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
