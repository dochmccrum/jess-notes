# Jess Notes on any Docker host: `docker compose up -d`, then open http://localhost:8080.
# Put it behind an HTTPS reverse proxy for anything but local use (docs/DEPLOY.md).
# On Coolify, use docker-compose.coolify.yml instead (docs/COOLIFY.md).
services:
  jess:
    image: ghcr.io/dochmccrum/jess-notes:1
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jess-data:/data
    environment:
      # Optional: create the account with this password on first start, instead of the
      # one-time setup code printed in the log (`docker compose logs jess`).
      # JESS_ADMIN_PASSWORD: change-me
      # Optional: push your notes as plain files to a private git repository (docs/DEPLOY.md §5).
      # JESS_GIT_REMOTE: git@github.com:you/notes-backup.git
      JESS_TRUST_PROXY: "true"
      RUST_LOG: info
    stop_grace_period: 30s

volumes:
  jess-data:
