[workspace]
resolver = "2"
members = ["core", "core/wasm", "server", "apps/native", "apps/tauri/src-tauri", "tools/vaultgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
yrs = "0.26"
minicbor = { version = "2.3", features = ["derive", "alloc"] }
unicode-normalization = "0.1.25"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
saphyr = "0.1"
percent-encoding = "2"

# Release binaries (server, Linux and Android apps): fat LTO across the whole dependency graph,
# one codegen unit, no symbols (DESIGN §22 item 77): the server 19 → 10 MB.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# `cargo test --release` (simulation, benchmarks) builds with this one, which would inherit the
# above: keep test builds quick and their backtraces symbolised.
[profile.bench]
lto = false
codegen-units = 16
strip = false

[profile.test]
opt-level = 1
[profile.test.package."*"]
opt-level = 2

# Size-optimised build for the web worker's core.wasm.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
