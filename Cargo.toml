[workspace]
resolver = "2"
members = ["core", "core/wasm", "server", "apps/native", "apps/tauri/src-tauri", "tools/vaultgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
yrs = "0.26"
minicbor = { version = "2.3", features = ["derive", "alloc"] }
unicode-normalization = "0.1.25"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
saphyr = "0.1"
percent-encoding = "2"

[profile.test]
opt-level = 1
[profile.test.package."*"]
opt-level = 2

# Size-optimised build for the web worker's core.wasm.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
