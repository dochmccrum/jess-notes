[package]
name = "jess-notes-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jess Notes desktop/mobile shell (Tauri 2) around jess-native."

[lib]
name = "jess_notes_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jess-native = { path = "../../native" }
# No asset compression: the UI is served from memory as-is (brotli-decoding every script at
# launch cost cold-start time; the binary grows by a few MB).
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-dialog = "2"
# Only its Rust API: opening Android `content://` documents (import/export zips) as files.
tauri-plugin-fs = "2"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
percent-encoding.workspace = true
# Binary IPC bodies on Android arrive as base64 (see `raw_body`).
base64 = "0.22"
