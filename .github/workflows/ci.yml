name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: long simulation run, benchmarks
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: pdfium (PDF thumbnails/text in tests; same build as the image)
        run: |
          curl -fsSL -o /tmp/p.whl https://files.pythonhosted.org/packages/d3/7c/74a2fb48e5b0d2402d9ca64b39074c722d67e9a8a2c58449a843a8c2329a/pypdfium2-5.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "81df25c1ab4c13ff773102d3cbea1967511d079123b067fc077bd0c4d57d91d8  /tmp/p.whl" | sha256sum -c -
          unzip -q -j /tmp/p.whl 'pypdfium2_raw/libpdfium.so' -d "$HOME/pdfium"
          echo "JESS_PDFIUM_LIB=$HOME/pdfium/libpdfium.so" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      # The Tauri shell needs WebKitGTK and the built UI: it has its own job below.
      - run: cargo clippy --workspace --exclude jess-notes-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude jess-notes-app
      # Spaces (DESIGN §24): the embedded server in jess-native, behind the feature the apps enable.
      - run: cargo clippy -p jess-native --features spaces --all-targets -- -D warnings
      - run: cargo test -p jess-native --features spaces --test spaces
      - run: cargo build -p jess-core-wasm --target wasm32-unknown-unknown --release
      - name: Crash tests (more iterations)
        run: CRASH_ITERS=20 cargo test -p jess-server --test crash

  simulation:
    # 10k seeds on a push; nightly, 1M seeds in 8 parallel shards of 125k (one sequential run of
    # 1M took the runner past its limits).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'schedule' && '[0,1,2,3,4,5,6,7]' || '[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - name: Deterministic simulation (10k seeds; 1M nightly in shards)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then N=125000; else N=10000; fi
          SIM_START=$(( ${{ matrix.shard }} * N )) SIM_SEEDS=$N cargo test --release -p jess-server --test sim -- --nocapture

  yjs-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - run: cd core/tests/yjs-compat && npm ci || npm install
      - name: Yjs → yrs (fixtures regenerated by real Yjs, applied by yrs)
        run: cd core/tests/yjs-compat && node gen.mjs && cd ../../.. && cargo test -p jess-core --test yjs_compat
      - name: yrs → Yjs
        run: cd core/tests/yjs-compat && node verify.mjs
      - name: Fixtures unchanged
        run: git diff --exit-code core/fixtures

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: pdfium (PDF thumbnails/text in tests; same build as the image)
        run: |
          curl -fsSL -o /tmp/p.whl https://files.pythonhosted.org/packages/d3/7c/74a2fb48e5b0d2402d9ca64b39074c722d67e9a8a2c58449a843a8c2329a/pypdfium2-5.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "81df25c1ab4c13ff773102d3cbea1967511d079123b067fc077bd0c4d57d91d8  /tmp/p.whl" | sha256sum -c -
          unzip -q -j /tmp/p.whl 'pypdfium2_raw/libpdfium.so' -d "$HOME/pdfium"
          echo "JESS_PDFIUM_LIB=$HOME/pdfium/libpdfium.so" >> "$GITHUB_ENV"
      - name: wasm-bindgen-cli (must match the wasm-bindgen crate)
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: cd ui && pnpm install --frozen-lockfile
      - run: cd ui && pnpm wasm
      - run: cd ui && pnpm check
      - run: cd ui && pnpm test
      - name: Build + bundle budgets (fails when over)
        run: cd ui && pnpm build
      - run: cargo build -p jess-server
      - run: cd ui && pnpm exec playwright install --with-deps chromium webkit
      - name: Playwright (Chromium, touch emulation, WebKit)
        run: cd ui && E2E_WEBKIT=1 pnpm e2e
      - name: Minimum engine, Chromium 100 (DESIGN §22)
        run: |
          curl -fsSL -o /tmp/c.zip https://commondatastorage.googleapis.com/chromium-browser-snapshots/Linux_x64/972765/chrome-linux.zip
          unzip -q /tmp/c.zip -d /tmp/c100
          node ui/e2e/old-chromium.mjs /tmp/c100/chrome-linux/chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: ui/test-results

  bench:
    # DESIGN §18: the generated 10k-note vault, thresholds in bench/thresholds.json. Nightly and on
    # demand only (~45 runner-minutes; `scripts/bench.sh` checks the targets locally before a push).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: pdfium (the server derives PDF text and thumbnails)
        run: |
          curl -fsSL -o /tmp/p.whl https://files.pythonhosted.org/packages/d3/7c/74a2fb48e5b0d2402d9ca64b39074c722d67e9a8a2c58449a843a8c2329a/pypdfium2-5.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "81df25c1ab4c13ff773102d3cbea1967511d079123b067fc077bd0c4d57d91d8  /tmp/p.whl" | sha256sum -c -
          unzip -q -j /tmp/p.whl 'pypdfium2_raw/libpdfium.so' -d "$HOME/pdfium"
          echo "JESS_PDFIUM_LIB=$HOME/pdfium/libpdfium.so" >> "$GITHUB_ENV"
      - name: wasm-bindgen-cli (must match the wasm-bindgen crate)
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: sudo apt-get update && sudo apt-get install -y binaryen zip
      - run: cd ui && pnpm install --frozen-lockfile && pnpm wasm && pnpm build
      - run: cd ui && pnpm exec playwright install --with-deps chromium
      - run: scripts/bench.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            target/bench/results.jsonl
            ui/test-results

  linux-app:
    runs-on: ubuntu-24.04
    env:
      # One CEF download for the debug (clippy) and release builds (DESIGN §23.2).
      CEF_PATH: /home/runner/cef
    steps:
      - name: Free disk space (CEF unpacks ~1.4 GB per build profile, plus the packages)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: GTK, CEF's build and run-time dependencies, bundling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libx11-dev libxdo-dev cmake ninja-build librsvg2-dev libayatana-appindicator3-dev patchelf file xvfb binaryen
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: cd ui && pnpm install --frozen-lockfile && pnpm wasm && pnpm build
      - run: cargo clippy -p jess-notes-app --all-targets -- -D warnings
      - run: cargo build -p jess-server
      # CEF (DESIGN §23.2): build, stage the CEF runtime next to it, then bundle (the second
      # build is a no-op), and drop the WebKitGTK dependency Tauri's bundler always adds.
      - name: Build the app on CEF and its .deb / AppImage
        run: |
          cargo build --release -p jess-notes-app --features tauri/custom-protocol
          apps/tauri/cef/stage.sh target/release
          cd apps/tauri && ../../ui/node_modules/.bin/tauri build --bundles deb,appimage
          for d in ../../target/release/bundle/deb/*.deb; do cef/fix-deb.sh "$d"; done
      # The installed package: its layout, dependencies and AppArmor profile (Ubuntu 24.04
      # restricts the user namespaces Chromium's sandbox needs) on a stock system.
      - name: Install the .deb
        run: sudo apt-get install -y ./target/release/bundle/deb/*.deb
      - name: Smoke test of the installed app (sign in, note, image via jess-blob://, PDF, search, cold start)
        run: xvfb-run -a -s "-screen 0 1280x900x24" node apps/tauri/e2e/smoke.mjs /usr/bin/jess-notes-app target/debug/jess
      # The AppImage lays CEF out differently (linuxdeploy owns usr/lib): run it too. No FUSE 2 on
      # the runners, so it extracts itself instead of mounting.
      - name: Smoke test of the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1280x900x24" node apps/tauri/e2e/smoke.mjs target/release/bundle/appimage/*.AppImage target/debug/jess
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-smoke-failure
          path: |
            /tmp/jess-app-e2e-*/*.png
            /tmp/jess-app-e2e-*/app.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  android-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # green runs took 32–58 min before fat LTO (four release ABIs); allow for it
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Free disk space (four release ABIs + a debug build overflow the runner's disk)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - name: NDK and binaryen
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y binaryen
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - run: cd ui && pnpm install --frozen-lockfile && pnpm wasm && pnpm build
      - run: cargo build -p jess-server
      - name: Release AAB and per-ABI APKs (unsigned here; see docs/ANDROID.md for signing)
        run: |
          cd apps/tauri
          ../../ui/node_modules/.bin/tauri android build --aab
          ../../ui/node_modules/.bin/tauri android build --apk --split-per-abi
          rm -rf ../../target/*-linux-android*/release  # packaged already; frees space for the debug build
          df -h /
      - name: Debug APK for the emulator
        run: cd apps/tauri && ../../ui/node_modules/.bin/tauri android build --debug --target x86_64 --apk
      # The emulator needs ~7.5 GB for its data partition. The APKs/AAB are packaged by now: drop
      # the per-ABI Rust builds and Gradle's intermediates (target/debug/jess, the smoke test's
      # server, and the packaged outputs stay).
      - name: Free disk space for the emulator
        run: |
          rm -rf target/*-linux-android* apps/tauri/src-tauri/gen/android/app/build/intermediates \
            apps/tauri/src-tauri/gen/android/app/build/tmp ~/.gradle/caches/transforms-*
          df -h /
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator (API 33, WebView 109 as shipped)
        timeout-minutes: 20 # ~6 min when green; a hung emulator otherwise holds the job for hours
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apps/tauri/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            node apps/tauri/e2e/android-smoke.mjs target/debug/jess
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-smoke-failure
          path: /tmp/jess-android-e2e-*/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            apps/tauri/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
            apps/tauri/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t jess:ci .
      - name: Smoke test
        run: |
          docker run -d --name jess -p 8080:8080 -e JESS_ADMIN_PASSWORD=ci-password-123 jess:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
          docker exec jess jess integrity-check
