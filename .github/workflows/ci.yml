name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: long simulation run

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p jess-core-wasm --target wasm32-unknown-unknown --release
      - name: Crash tests (more iterations)
        run: CRASH_ITERS=20 cargo test -p jess-server --test crash

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - name: Deterministic simulation (10k seeds; 1M nightly in shards)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then N=1000000; else N=10000; fi
          SIM_SEEDS=$N cargo test --release -p jess-server --test sim -- --nocapture

  yjs-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - run: cd core/tests/yjs-compat && npm ci || npm install
      - name: Yjs → yrs (fixtures regenerated by real Yjs, applied by yrs)
        run: cd core/tests/yjs-compat && node gen.mjs && cd ../../.. && cargo test -p jess-core --test yjs_compat
      - name: yrs → Yjs
        run: cd core/tests/yjs-compat && node verify.mjs
      - name: Fixtures unchanged
        run: git diff --exit-code core/fixtures
